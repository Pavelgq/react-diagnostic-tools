name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: input
    id: hook
    attributes:
      label: Which hook (if applicable)
      placeholder: useWhyRender
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A minimal code sample, or a link to a repo/StackBlitz/CodeSandbox
        that reproduces the issue. This is the single most useful thing you
        can provide.
      render: tsx
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.0.1
    validations:
      required: true

  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: 19.2.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, framework (Next.js/Vite/CRA/...), SSR or client-only, etc.
    validations:
      required: false
